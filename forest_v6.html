  function eatItem(id) {
    const it = ITEMS[id];
    const cooked = nearLitFire(pl.x, pl.y, 110);
    if (it.cookTo && cooked) {
      take(id);
      give(it.cookTo);
      toast('Nướng chín: ' + ITEMS[it.cookTo].n);
      return;
    }
    take(id);
    pl.hunger = Math.min(100, pl.hunger + it.hunger);
    if (Math.random() < (it.risk || 0)) {
      pl.poison = Math.max(pl.poison, it.poisonT || 6);
      toast('Ngộ độc! ' + (it.cookTo ? 'Ăn đồ sống mà không nướng.' : 'Đồ này gây độc.'));
    } else if (it.cookTo) {
      toast('Ăn sống: ' + it.n + ' (nên nướng trước)');
    } else {
      toast('Ăn ' + it.n);
    }
  }

  function equipItem(id) {
    const slot = ITEMS[id].t;
    if (equip[slot]) give(equip[slot]);
    equip[slot] = id;
    take(id);
    toast('Trang bị: ' + ITEMS[id].n);
  }

  function unequip(slot) {
    if (!equip[slot]) return;
    give(equip[slot]);
    equip[slot] = null;
  }

  function placeFire() {
    if (nearLitFire(pl.x, pl.y, 120)) { toast('Đã có lửa gần đây'); return; }
    take('campfire_kit');
    FIRES.push({ x: pl.x + Math.cos(pl.ang) * 40, y: pl.y + Math.sin(pl.ang) * 40, fuel: 60, max: 200 });
    sfx('fire');
    toast('Nhóm lửa (60s). E cạnh lửa để thêm gỗ');
  }

  function useItem(id) {
    const it = ITEMS[id];
    if (!it) return;
    if (it.t === 'weapon' || it.t === 'armor') return equipItem(id);
    if (it.t === 'food') return eatItem(id);
    if (id === 'bandage') {
      if (pl.hp >= 100) return toast('Máu đầy rồi');
      take(id);
      pl.hp = Math.min(100, pl.hp + it.heal);
      return toast('Băng bó: +' + it.heal + ' máu');
    }
    if (id === 'antidote') {
      if (pl.poison <= 0) return toast('Không bị độc');
      take(id);
      pl.poison = 0;
      return toast('Đã giải độc');
    }
    if (id === 'campfire_kit') return placeFire();
    if (id === 'torch') {
      take(id);
      pl.torch = it.dur;
      return toast('Đốt đuốc: tầm nhìn xa hơn (90s)');
    }
    toast(it.n + ' không dùng trực tiếp được');
  }

  function canCraft(r) {
    return Object.keys(r.cost).every((k) => has(k, r.cost[k]));
  }

  function craft(i) {
    const r = RECIPES[i];
    if (!canCraft(r)) return toast('Thiếu nguyên liệu');
    for (const k in r.cost) take(k, r.cost[k]);
    give(r.out, r.n);
    toast('Chế tạo: ' + ITEMS[r.out].n);
  }

  /* ---------- hành động ---------- */
  function openCrate(o) {
    o.gone = true;
    const items = {};
    for (const [id, a, b, p] of CRATE) {
      if (Math.random() < p) {
        const n = a + Math.floor(Math.random() * (b - a + 1));
        items[id] = (items[id] || 0) + n;
      }
    }
    if (!Object.keys(items).length) items.fiber = 1;
    for (const k in items) give(k, items[k]);
    toast('Mở rương: ' + fmt(items));
  }

  const NOTES = [
    'Trang nhật ký ướt, mực nhòe: "Tiếng chuông lại vang lúc ba giờ mười bảy. Con bé nói có người đứng ngoài cửa sổ, nhưng cửa sổ ở tầng hai."',
    'Mảnh giấy dán trên tường, nét chữ vội: "KHÔNG trả lời khi rừng gọi tên bạn. Dù đó là giọng ai."',
    'Lá thư chưa gửi, đề địa chỉ phòng thí nghiệm Mù Lâm, ngày 14/3/1998: "Chúng tôi đã thấy những gì ở dưới đất. Xin đừng đưa thêm người vào."'
  ];
  function searchHouse(h) {
    h.searched = true;
    sfx('door', h.x, h.y);
    const roll = Math.random();
    if (roll < 0.45) {
      const items = {};
      for (const [id, a, b, p] of CRATE) {
        if (Math.random() < p * 0.8) items[id] = (items[id] || 0) + a + Math.floor(Math.random() * (b - a + 1));
      }
      if (!Object.keys(items).length) items.fiber = 1;
      for (const k in items) give(k, items[k]);
      toast('Lục nhà: ' + fmt(items));
    } else if (roll < 0.7) {
      const type = isNight() || Math.random() < 0.4 ? 'shade' : 'wolf';
      MON.push(makeMon(type, h.x, h.y + 70));
      shake = Math.max(shake, 10);
      sfx('jump');
      addFloat(h.x, h.y - 40, '!', '#ff6b6b');
      toast('Có thứ gì đó lao ra từ cửa!');
    } else if (roll < 0.85) {
      say('Ghi chú', [NOTES[Math.floor(Math.random() * NOTES.length)]], null);
    } else {
      toast('Nhà trống. Chỉ có mùi ẩm và tiếng nước nhỏ giọt.');
    }
  }

  function drawFrame() {
    const f = FRAME_SPR.cv;
    const s = Math.min(vw, vh) * 0.55;
    g.save();
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.globalAlpha = 0.9;
    g.drawImage(f, 0, 0, s, s);
    g.save(); g.translate(vw, 0); g.scale(-1, 1); g.drawImage(f, 0, 0, s, s); g.restore();
    g.save(); g.translate(0, vh); g.scale(1, -1); g.drawImage(f, 0, 0, s, s); g.restore();
    g.save(); g.translate(vw, vh); g.scale(-1, -1); g.drawImage(f, 0, 0, s, s); g.restore();
    g.restore();
  }

  function interact() {
    for (const s of STORY_OBJS) {
      if (!STORY[s.id] && Math.hypot(s.x - pl.x, s.y - pl.y) < 50) { pickStory(s.id); return; }
    }
    let best = null, bd = 46;
    for (const p of LOOT) {
      const d = Math.hypot(p.x - pl.x, p.y - pl.y);
      if (d < bd) { bd = d; best = p; }
    }
    if (best) {
      LOOT.splice(LOOT.indexOf(best), 1);
      for (const k in best.items) give(k, best.items[k]);
      toast('Nhặt: ' + fmt(best.items));
      return;
    }
    for (const o of nearObjs(pl.x, pl.y, 60)) {
      if (o.kind === 'house') {
        if (!o.searched) searchHouse(o);
        else toast('Căn nhà này đã được lục soát');
        return;
      }
      if (o.kind === 'crate') { openCrate(o); return; }
      if (o.kind === 'bush') {
        o.gone = true;
        const r = Math.random();
        const id = r < 0.45 ? 'berry' : r < 0.7 ? 'herb' : 'fiber';
        const n = 1 + (Math.random() < 0.4 ? 1 : 0);
        give(id, n);
        toast('Hái ' + ITEMS[id].n + ' ×' + n);
        return;
      }
      if (o.kind === 'mush') {
        o.gone = true;
        const id = o.v ? 'mushroom_tan' : 'mushroom_red';
        give(id);
        toast('Hái ' + ITEMS[id].n);
        return;
      }
    }
    for (const f of FIRES) {
      if (Math.hypot(f.x - pl.x, f.y - pl.y) >= 70) continue;
      if (f.fuel <= 0) {
        if (!has('stone') || !has('wood')) return toast('Lửa tắt. Cần đá và gỗ để nhóm lại');
        take('wood');
        f.fuel = 40;
        return toast('Nhóm lại lửa (40s)');
      }
      if (!has('wood')) return toast('Cần gỗ để thêm vào lửa');
      take('wood');
      f.fuel = Math.min(f.max, f.fuel + 40);
      return toast('Thêm gỗ, lửa cháy thêm 40s');
    }
    toast('Không có gì để nhặt');
  }

  function doAction() {
    const w = weapon();
    pl.swing = 0.18;
    const fx = Math.cos(pl.ang), fy = Math.sin(pl.ang);

    let bm = null, bd = Infinity;
    for (const m of MON) {
      const dx = m.x - pl.x, dy = m.y - pl.y, d = Math.hypot(dx, dy);
      if (d > w.range + MT[m.type].r) continue;
      if ((dx * fx + dy * fy) / (d || 1) < Math.cos(FRONT)) continue;
      if (d < bd) { bd = d; bm = m; }
    }
    if (bm) { hitMon(bm, w.dmg); return; }

    let bo = null; bd = Infinity;
    for (const o of nearObjs(pl.x, pl.y, w.range + 30)) {
      if (o.kind !== 'tree' && o.kind !== 'rock') continue;
      const dx = o.x - pl.x, dy = o.y - pl.y, d = Math.hypot(dx, dy);
      if ((dx * fx + dy * fy) / (d || 1) < Math.cos(FRONT)) continue;
      if (d < bd) { bd = d; bo = o; }
    }
    if (!bo) return;
    if (bo.kind === 'tree') {
      const wood = w.chop || 1;
      bo.hp -= wood;
      burst(bo.x, bo.y - 40, '#c8a070', 6, 60);
      sfx('chop');
      give('wood', wood);
      if (bo.hp <= 0) { bo.gone = true; give('wood', 2); toast('Cây đổ: +2 gỗ'); }
    } else {
      bo.hp -= 1;
      burst(bo.x, bo.y - 20, '#dfe3ea', 6, 60);
      sfx('rock');
      give('stone');
      if (Math.random() < 0.25) give('fiber');
      if (bo.hp <= 0) { bo.gone = true; give('stone', 2); toast('Đá vỡ: +2 đá'); }
    }
  }

  /* ---------- quái ---------- */
  function makeMon(type, x, y) {
    return { type, x, y, hp: MT[type].hp, t: Math.random() * 3, dx: 0, dy: 0,
             cd: 0, flee: 0, hurt: 0, face: 1, dead: false };
  }

  function seen(m) {
    const dx = m.x - pl.x, dy = m.y - pl.y, d = Math.hypot(dx, dy);
    if (d < SENSE_R || inFire(m.x, m.y)) return true;
    if (d > visR()) return false;
    const diff = Math.atan2(Math.sin(Math.atan2(dy, dx) - pl.view), Math.cos(Math.atan2(dy, dx) - pl.view));
    return Math.abs(diff) <= HALF_FOV;
  }

  function dropLoot(m) {
    const items = {};
    for (const [id, a, b] of MT[m.type].drop) {
      const n = a + Math.floor(Math.random() * (b - a + 1));
      if (n > 0) items[id] = (items[id] || 0) + n;
    }
    if (Object.keys(items).length) LOOT.push({ x: m.x, y: m.y, items });
  }

  function hitMon(m, dmg) {
    m.hp -= dmg;
    m.hurt = 0.25;
    sfx('hit', m.x, m.y);
    addFloat(m.x, m.y - 44, String(dmg), '#ffe08a');
    burst(m.x, m.y - 12, '#d9c28a', 8, 70);
    if (MT[m.type].passive) m.flee = 3.5;
    if (m.hp <= 0) {
      m.dead = true;
      dropLoot(m);
      toast('Hạ ' + MT[m.type].name);
      sfx('death', m.x, m.y);
    }
  }

  function updMon(m, dt) {
    const c = MT[m.type];
    m.cd = Math.max(0, m.cd - dt);
    m.hurt = Math.max(0, m.hurt - dt);
    if (m.type === 'shade' && !isNight()) { m.dead = true; return; }
    const dx = pl.x - m.x, dy = pl.y - m.y, d = Math.hypot(dx, dy);
    if (d > 1600) { m.dead = true; return; }

    let vx = 0, vy = 0, spd = 0;
    if (m.flee > 0) {
      m.flee -= dt;
      const al = d || 1;
      vx = -dx / al; vy = -dy / al;
      spd = c.spd * 1.5;
    } else if (!c.passive && d < c.aggro && !inFire(m.x, m.y)) {
      if (!m.alert) { m.alert = true; sfx('growl', m.x, m.y); }
      if (d > c.r + PR + 12) {
        vx = dx / d; vy = dy / d;
        spd = c.spd;
      } else if (m.cd <= 0) {
        m.cd = c.cd;
        hurtPlayer(c.dmg);
      }
    } else {
      m.t -= dt;
      m.alert = false;
      if (m.t <= 0) {
        m.t = 2 + Math.random() * 3;
        const a = Math.random() * Math.PI * 2;
        const still = Math.random() < 0.3;
        m.dx = still ? 0 : Math.cos(a);
        m.dy = still ? 0 : Math.sin(a);
      }
      vx = m.dx; vy = m.dy;
      spd = c.spd * 0.35;
    }

    if (spd > 0 && (vx || vy)) {
      if (vx) m.face = vx > 0 ? 1 : -1;
      const wasIn = inFire(m.x, m.y);
      const nx = m.x + vx * spd * dt, ny = m.y + vy * spd * dt;
      if (!blocked(nx, m.y, c.r) && (wasIn || !inFire(nx, m.y))) m.x = nx;
      if (!blocked(m.x, ny, c.r) && (wasIn || !inFire(m.x, ny))) m.y = ny;
    }
  }

  let spawnTimer = 2;
  function trySpawn(dt) {
    spawnTimer -= dt;
    if (spawnTimer > 0) return;
    const night = isNight();
    spawnTimer = night ? 1.4 : 3;
    if (MON.length >= (night ? 14 : 7)) return;
    const pool = night ? ['wolf', 'wolf', 'shade', 'shade', 'boar'] : ['boar', 'boar', 'wolf'];
    const type = pool[Math.floor(Math.random() * pool.length)];
    const a = Math.random() * Math.PI * 2, d = 500 + Math.random() * 250;
    const x = pl.x + Math.cos(a) * d, y = pl.y + Math.sin(a) * d;
    if (blocked(x, y, MT[type].r)) return;
    MON.push(makeMon(type, x, y));
  }

  /* ---------- cập nhật ---------- */
  function updatePlayer(dt) {
    let ix = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0) + joy.x;
    let iy = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0) + joy.y;
    if (target && !ix && !iy) {
      const dx = target.x - pl.x, dy = target.y - pl.y, d = Math.hypot(dx, dy);
      if (d < 6) target = null;
      else { ix = dx / d; iy = dy / d; }
    }
    const m = Math.hypot(ix, iy);
    pl.moving = false;
    if (m > 0.08) {
      if (m > 1) { ix /= m; iy /= m; }
      if (!mouse.on) pl.ang = Math.atan2(iy, ix);
      const v = (keys.shift ? 420 : 260) * dt;
      const ox = pl.x, oy = pl.y;
      const nx = pl.x + ix * v, ny = pl.y + iy * v;
      if (!blocked(nx, pl.y, PR)) pl.x = nx;
      if (!blocked(pl.x, ny, PR)) pl.y = ny;
      if (Math.abs(pl.x - ox) + Math.abs(pl.y - oy) > 0.01) {
        pl.moving = true;
        if (Math.floor(pl.step * 6) !== Math.floor((pl.step + dt) * 6)) { burst(pl.x, pl.y + 2, '#8a7a5a', 1, 18); sfx('step'); }
        pl.step += dt;
      } else {
        target = null;
      }
    }
  }

  function updStats(dt) {
    pl.hunger = Math.max(0, pl.hunger - 0.45 * dt);
    pl.hitT += dt;
    pl.flash = Math.max(0, pl.flash - dt);
    pl.swing = Math.max(0, pl.swing - dt);
    pl.torch = Math.max(0, pl.torch - dt);
    if (pl.poison > 0) {
      pl.poison = Math.max(0, pl.poison - dt);
      pl.hp -= 2 * dt;
    }
    if (pl.hunger <= 0) pl.hp -= 1.5 * dt;
    if (pl.hunger > 40 && pl.poison <= 0 && pl.hitT > 6) pl.hp = Math.min(100, pl.hp + 1.2 * dt);
    if (pl.hp <= 0) respawn();
    for (const f of FIRES) if (f.fuel > 0) f.fuel = Math.max(0, f.fuel - dt);
  }

  function update(dt) {
    updateFx(dt);
    audioUpdate(dt);
    updatePlayer(dt);
    updStats(dt);
    if (TOAST.t > 0) TOAST.t -= dt;
    trySpawn(dt);
    for (const m of MON) updMon(m, dt);
    for (let i = MON.length - 1; i >= 0; i--) if (MON[i].dead) MON.splice(i, 1);
    camx += (pl.x - camx) * Math.min(1, dt * 8);
    camy += (pl.y - 20 - camy) * Math.min(1, dt * 8);
  }

  /* ---------- vẽ ---------- */
  const cvEl = document.getElementById('world');
  const g = cvEl.getContext('2d');

  function drawPlayer(c, x, y, dir, step, moving, t) {
    const a = pl.view;
    const bob = moving ? Math.sin(step * 10) * 1.2 : Math.sin(t * 2) * 0.4;
    c.save();
    c.translate(x, y);
    softShadow(c, 3, 4, 18, 0.5);
    c.rotate(a);
    // áo choàng
    const cg = c.createRadialGradient(-2, -3, 2, 0, 0, 14);
    cg.addColorStop(0, '#4e6a5c');
    cg.addColorStop(1, '#16221d');
    c.fillStyle = cg;
    c.beginPath(); c.ellipse(-2, 0, 11 + bob * 0.3, 9 - bob * 0.3, 0, 0, Math.PI * 2); c.fill();
    c.strokeStyle = 'rgba(180,220,190,.25)';
    c.lineWidth = 1;
    c.stroke();
    if (equip.armor) {
      c.fillStyle = 'rgba(138,106,74,.6)';
      c.beginPath(); c.ellipse(-2, 0, 7, 6, 0, 0, Math.PI * 2); c.fill();
    }
    // đầu trùm mũ
    c.fillStyle = '#0c1210';
    c.beginPath(); c.arc(4, 0, 6.5, 0, Math.PI * 2); c.fill();
    // tay cầm đèn
    c.fillStyle = '#b9a88f';
    c.beginPath(); c.arc(12, -6, 2.6, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(12, 6, 2.6, 0, Math.PI * 2); c.fill();
    if (pl.torch > 0) {
      const fl = 3 + Math.sin(T * 14);
      c.fillStyle = 'rgba(255,176,74,.35)';
      c.beginPath(); c.arc(14, 0, 22 + fl, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#ffb04a';
      c.beginPath(); c.arc(14, 0, fl, 0, Math.PI * 2); c.fill();
    } else {
      c.fillStyle = 'rgba(200,230,210,.12)';
      c.beginPath(); c.arc(14, 0, 14, 0, Math.PI * 2); c.fill();
    }
    c.restore();
  }

  function drawSwing() {
    g.strokeStyle = `rgba(255,240,200,${pl.swing * 4})`;
    g.lineWidth = 3;
    g.beginPath();
    g.arc(pl.x, pl.y - 20, 34, pl.view - 0.9, pl.view + 0.9);
    g.stroke();
  }

  function drawMon(m) {
    const c = MT[m.type];
    g.save();
    g.translate(m.x, m.y);
    g.scale(m.face, 1);
    if (m.hurt > 0 && Math.floor(T * 20) % 2) g.globalAlpha = 0.5;
    softShadow(g, 2, 4, 22, 0.45);
    if (m.type === 'boar') {
      const bg = g.createRadialGradient(-3, -3, 2, 0, 0, 16);
      bg.addColorStop(0, '#7a5a40');
      bg.addColorStop(1, '#3a2a1e');
      g.fillStyle = bg;
      g.beginPath(); g.ellipse(0, 0, 15, 10, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#4a3424';
      g.beginPath(); g.ellipse(12, 0, 7, 6, 0, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#e8e0c4';
      g.lineWidth = 1.6;
      g.beginPath(); g.moveTo(16, -4); g.lineTo(19, -6); g.moveTo(16, 4); g.lineTo(19, 6); g.stroke();
    } else if (m.type === 'wolf') {
      const wg = g.createRadialGradient(-2, -2, 2, 0, 0, 15);
      wg.addColorStop(0, '#9aa0aa');
      wg.addColorStop(1, '#3c414b');
      g.fillStyle = wg;
      g.beginPath(); g.ellipse(0, 0, 15, 7, 0, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.ellipse(13, 0, 7, 5, 0, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.moveTo(8, -4); g.lineTo(10, -10); g.lineTo(13, -4); g.fill();
      g.beginPath(); g.moveTo(8, 4); g.lineTo(10, 10); g.lineTo(13, 4); g.fill();
      g.strokeStyle = '#3c414b';
      g.lineWidth = 2.5;
      g.beginPath(); g.moveTo(-13, 0); g.quadraticCurveTo(-22, -4, -20, -10); g.stroke();
      g.fillStyle = '#ffd27a';
      g.beginPath(); g.arc(17, -2, 1.1, 0, Math.PI * 2); g.arc(17, 2, 1.1, 0, Math.PI * 2); g.fill();
    } else {
      const pulse = 0.5 + 0.5 * Math.sin(T * 4 + m.x);
      const rg = g.createRadialGradient(0, 0, 2, 0, 0, 24);
      rg.addColorStop(0, 'rgba(90,60,150,.55)');
      rg.addColorStop(1, 'rgba(10,6,22,0)');
      g.fillStyle = rg;
      g.beginPath(); g.arc(0, 0, 24, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#080612';
      g.beginPath(); g.ellipse(0, 0, 11, 8, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = `rgba(127,214,255,${0.6 + 0.4 * pulse})`;
      g.beginPath(); g.arc(5, -3, 1.6, 0, Math.PI * 2); g.arc(5, 3, 1.6, 0, Math.PI * 2); g.fill();
    }
    g.restore();

    if (m.hp < c.hp) {
      g.fillStyle = 'rgba(0,0,0,.6)';
      g.fillRect(m.x - 14, m.y - 30, 28, 4);
      g.fillStyle = '#d9534f';
      g.fillRect(m.x - 14, m.y - 30, 28 * (m.hp / c.hp), 4);
    }
  }

  function drawFire(f) {
    const lit = f.fuel > 0;
    g.save();
    g.translate(f.x, f.y);
    g.fillStyle = 'rgba(0,0,0,.35)';
    g.beginPath(); g.ellipse(0, 4, 22, 7, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#4a4650';
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * Math.PI * 2;
      g.beginPath(); g.ellipse(Math.cos(a) * 15, Math.sin(a) * 6, 4, 3, 0, 0, Math.PI * 2); g.fill();
    }
    if (lit) {
      const k = 0.5 + 0.5 * Math.sin(T * 9 + f.x);
      const rg = g.createRadialGradient(0, -8, 2, 0, -8, 60);
      rg.addColorStop(0, 'rgba(255,160,70,.25)');
      rg.addColorStop(1, 'rgba(255,160,70,0)');
      g.fillStyle = rg;
      g.beginPath(); g.arc(0, -8, 60, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#ff8a3d';
      g.beginPath();
      g.moveTo(-9, 0);
      g.quadraticCurveTo(-6, -18 - k * 6, 0, -28 - k * 8);
      g.quadraticCurveTo(6, -18 - k * 6, 9, 0);
      g.closePath(); g.fill();
      g.fillStyle = '#ffe08a';
      g.beginPath();
      g.moveTo(-4, 0);
      g.quadraticCurveTo(-2, -10, 0, -16 - k * 4);
      g.quadraticCurveTo(2, -10, 4, 0);
      g.closePath(); g.fill();
      g.strokeStyle = 'rgba(255,200,120,.12)';
      g.lineWidth = 1;
      g.setLineDash([6, 8]);
      g.beginPath(); g.arc(0, 0, FIRE_R, 0, Math.PI * 2); g.stroke();
      g.setLineDash([]);
    } else {
      g.fillStyle = '#2a2a2a';
      g.beginPath(); g.ellipse(0, 0, 10, 4, 0, 0, Math.PI * 2); g.fill();
    }
    g.restore();
  }

  function drawObj(o) {
    if (o.kind === 'mono') {
      const a = 0.25 + 0.1 * Math.sin(T * 2 + o.x);
      const rg = g.createRadialGradient(o.x, o.y, 4, o.x, o.y, 60);
      rg.addColorStop(0, `rgba(120,230,255,${a})`);
      rg.addColorStop(1, 'rgba(120,230,255,0)');
      g.fillStyle = rg;
      g.fillRect(o.x - 60, o.y - 60, 120, 120);
    }
    const s = sprFor(o);
    g.drawImage(s.cv, o.x - s.ox, o.y - s.oy);
  }

  function bar(x, y, w, label, ratio, col) {
    g.fillStyle = 'rgba(255,255,255,.1)';
    g.fillRect(x + 44, y, w - 44, 12);
    g.fillStyle = col;
    g.fillRect(x + 44, y, (w - 44) * Math.max(0, Math.min(1, ratio)), 12);
    g.fillStyle = '#cfd8c8';
    g.font = '12px system-ui,sans-serif';
    g.textAlign = 'left';
    g.fillText(label, x, y + 10);
  }

  function drawHUD() {
    const x = 14, y = 14, W = 190;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.fillStyle = 'rgba(8,12,10,.72)';
    g.fillRect(x - 8, y - 8, W + 16, 96);
    bar(x, y, W, 'Máu', pl.hp / 100, '#d9534f');
    bar(x, y + 24, W, 'No', pl.hunger / 100, '#e0a84f');
    bar(x, y + 48, W, 'Độc', pl.poison > 0 ? Math.min(1, pl.poison / 8) : 0, '#7affc0');
    g.font = '12px system-ui,sans-serif';
    g.fillStyle = '#cfd8c8';
    g.textAlign = 'left';
    const wn = equip.weapon ? ITEMS[equip.weapon].n : FIST.n;
    const an = equip.armor ? ITEMS[equip.armor].n : 'không';
    g.fillText('Vũ khí: ' + wn + '  ·  Giáp: ' + an, x, y + 80);
    const cq = QUESTS.find((q) => !q.done);
    if (cq) {
      g.fillStyle = 'rgba(8,12,10,.72)';
      g.fillRect(x - 8, y + 100, 330, 26);
      g.fillStyle = '#e8d9a8';
      g.fillText('◆ ' + cq.t, x, y + 117);
    }

    g.textAlign = 'right';
    g.fillText(hhmm(clockMin()) + '  ·  ' + (isNight() ? 'Đêm' : 'Ngày'), vw - 14, 24);
    g.textAlign = 'center';
    g.fillStyle = 'rgba(207,216,200,.8)';
    g.fillText('X ' + Math.round(pl.x) + '    Y ' + Math.round(pl.y), vw / 2, 26);

    g.textAlign = 'center';
    g.fillStyle = 'rgba(207,216,200,.55)';
    g.fillText('WASD đi · chuột ngắm · F đánh/chặt · E nhặt · I túi đồ · J nhật ký · Esc menu · Shift chạy', vw / 2, vh - 14);

    if (TOAST.t > 0) {
      g.globalAlpha = Math.min(1, TOAST.t);
      g.font = '14px system-ui,sans-serif';
      const tw = g.measureText(TOAST.msg).width + 26;
      g.fillStyle = 'rgba(8,12,10,.85)';
      g.fillRect(vw / 2 - tw / 2, 58, tw, 30);
      g.fillStyle = '#eef5e6';
      g.fillText(TOAST.msg, vw / 2, 78);
      g.globalAlpha = 1;
    }
    if (pl.flash > 0) {
      g.fillStyle = `rgba(200,30,30,${pl.flash * 0.6})`;
      g.fillRect(0, 0, vw, vh);
    }
  }

  function render() {
    const hw = vw / sc / 2, hh = vh / sc / 2;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = '#05070a';
    g.fillRect(0, 0, vw, vh);

    g.save();
    g.translate(vw / 2, vh / 2);
    g.scale(sc, sc);
    g.translate(-camx + (Math.random() - 0.5) * shake, -camy + (Math.random() - 0.5) * shake);

    for (let ty = Math.floor((camy - hh) / TS); ty <= Math.floor((camy + hh) / TS); ty++) {
      for (let tx = Math.floor((camx - hw) / TS); tx <= Math.floor((camx + hw) / TS); tx++) {
        g.drawImage(getTile(tx, ty), tx * TS, ty * TS);
      }
    }

    const cx0 = Math.floor((camx - hw - 200) / CH), cx1 = Math.floor((camx + hw + 200) / CH);
    const cy0 = Math.floor((camy - hh - 200) / CH), cy1 = Math.floor((camy + hh + 200) / CH);
    const ents = [];
    for (let cy = cy0; cy <= cy1; cy++) {
      for (let cx = cx0; cx <= cx1; cx++) {
        for (const o of getChunk(cx, cy)) {
          if (o.gone) continue;
          if (o.x < camx - hw - 230 || o.x > camx + hw + 230 || o.y < camy - hh - 230 || o.y > camy + hh + 230) continue;
          ents.push({ y: o.y, o });
        }
      }
    }
    for (const m of MON) if (seen(m)) ents.push({ y: m.y, m });
    for (const f of FIRES) ents.push({ y: f.y, f });
    for (const p of LOOT) ents.push({ y: p.y, p });
    for (const s of STORY_OBJS) if (!STORY[s.id]) ents.push({ y: s.y, s });
    ents.push({ y: pl.y, pl: true });
    ents.sort((a, b) => a.y - b.y);

    const lights = [];
    const dir = Math.abs(Math.cos(pl.ang)) > Math.abs(Math.sin(pl.ang))
      ? (Math.cos(pl.ang) > 0 ? 'right' : 'left')
      : (Math.sin(pl.ang) > 0 ? 'down' : 'up');
    for (const e of ents) {
      if (e.pl) {
        drawPlayer(g, pl.x, pl.y, dir, pl.step, pl.moving, T);
        if (pl.swing > 0) drawSwing();
      } else if (e.o) {
        if (e.o.kind === 'mono') lights.push({ x: e.o.x, y: e.o.y, r: 100, a: 0.6 });
        drawObj(e.o);
      } else if (e.m) {
        drawMon(e.m);
      } else if (e.f) {
        if (e.f.fuel > 0) lights.push({ x: e.f.x, y: e.f.y - 8, r: FIRE_R * 1.1, a: 1 });
        drawFire(e.f);
      } else if (e.s) {
        lights.push({ x: e.s.x, y: e.s.y, r: 70, a: 0.5 });
        drawTape(e.s);
      } else {
        g.drawImage(SPR.sack.cv, e.p.x - SPR.sack.ox, e.p.y - SPR.sack.oy);
      }
    }

    drawParts();
    const night = daylight() <= 0.5;
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < FLY_N; i++) {
      const f = FLIES[i];
      const x = wr(f.x + Math.sin(T * 0.3 + f.p) * f.s, camx, 1400);
      const y = wr(f.y, camy, 1000) + Math.sin(T * 0.7 + f.p) * f.s;
      const a = (0.25 + 0.35 * (0.5 + 0.5 * Math.sin(T * 2 + f.p * 3))) * (night ? 1.4 : 0.6);
      g.fillStyle = `rgba(200,255,140,${a})`;
      g.beginPath(); g.arc(x, y, 2, 0, Math.PI * 2); g.fill();
    }

    g.globalCompositeOperation = 'source-over';
    for (const f of FOG) {
      const x = wr(f.x + T * f.v, camx, 2600), y = wr(f.y, camy, 1800);
      const rg = g.createRadialGradient(x, y, 0, x, y, f.r);
      rg.addColorStop(0, `rgba(120,150,130,${f.a})`);
      rg.addColorStop(1, 'rgba(120,150,130,0)');
      g.fillStyle = rg;
      g.fillRect(x - f.r, y - f.r, f.r * 2, f.r * 2);
    }
    g.restore();

    /* lớp tối: nón nhìn + cảm nhận gần + lửa + vật phát sáng */
    const sx = (pl.x - camx) * sc + vw / 2, sy = (pl.y - camy) * sc + vh / 2;
    lg.globalCompositeOperation = 'source-over';
    lg.clearRect(0, 0, vw, vh);
    lg.fillStyle = `rgba(${darkC()},${0.12 + nightK() * 0.55})`;
    lg.fillRect(0, 0, vw, vh);
    lg.globalCompositeOperation = 'destination-out';

    const hole = (x, y, r, a) => {
      const hx = (x - camx) * sc + vw / 2, hy = (y - camy) * sc + vh / 2, rr = r * sc;
      if (hx < -rr || hx > vw + rr || hy < -rr || hy > vh + rr) return;
      const rg = lg.createRadialGradient(hx, hy, 0, hx, hy, rr);
      rg.addColorStop(0, `rgba(0,0,0,${a})`);
      rg.addColorStop(1, 'rgba(0,0,0,0)');
      lg.fillStyle = rg;
      lg.fillRect(hx - rr, hy - rr, rr * 2, rr * 2);
    };

    // nón nhìn: tâm là người chơi, bán kính theo đuốc
    const R = visR() * sc;
    const grd = lg.createRadialGradient(sx, sy, 0, sx, sy, R);
    grd.addColorStop(0, 'rgba(0,0,0,1)');
    grd.addColorStop(0.75, 'rgba(0,0,0,0.95)');
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    const hasFilter = 'filter' in lg;
    if (hasFilter) lg.filter = 'blur(6px)';
    lg.fillStyle = grd;
    lg.beginPath();
    lg.moveTo(sx, sy);
    lg.arc(sx, sy, R, pl.view - HALF_FOV, pl.view + HALF_FOV);
    lg.closePath();
    lg.fill();
    if (hasFilter) lg.filter = 'none';

    hole(pl.x, pl.y, SENSE_R, 0.85);
    for (const l of lights) hole(l.x, l.y, l.r, l.a);

    lg.globalCompositeOperation = 'source-over';
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.globalCompositeOperation = 'multiply';
    g.fillStyle = `rgb(${skyC()})`;
    g.fillRect(0, 0, vw, vh);
    g.globalCompositeOperation = 'source-over';
    g.drawImage(lc, 0, 0, vw, vh);
    const vg = g.createRadialGradient(vw / 2, vh / 2, Math.min(vw, vh) * 0.3, vw / 2, vh / 2, Math.max(vw, vh) * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, `rgba(0,0,8,${0.45 + nightK() * 0.35})`);
    g.fillStyle = vg;
    g.fillRect(0, 0, vw, vh);

    drawFrame();
    drawHUD();
  }

  /* ---------- túi đồ ---------- */
  const invEl = document.getElementById('inv');
  const invList = document.getElementById('invlist');
  const craftList = document.getElementById('craftlist');
  const eqBoxes = invEl.querySelectorAll('.eq > div');

  function renderInv() {
    invList.innerHTML = Object.keys(inv).map((id) => {
      const it = ITEMS[id];
      const kind = it.t === 'weapon' || it.t === 'armor' ? 'Trang bị'
        : it.t === 'food' ? (it.cookTo ? 'Ăn (nướng trước khi ăn)' : 'Ăn')
        : it.t === 'use' ? 'Dùng' : 'Nguyên liệu';
      return `<button data-use="${id}"><b style="color:${it.c}">${it.n} ×${inv[id]}</b><small>${kind}</small></button>`;
    }).join('') || '<p class="empty">Trống</p>';

    eqBoxes[0].innerHTML = `<button data-slot="weapon">Vũ khí: ${equip.weapon ? ITEMS[equip.weapon].n : '—'}<small>${equip.weapon ? 'bấm để tháo' : 'trống'}</small></button>`;
    eqBoxes[1].innerHTML = `<button data-slot="armor">Giáp: ${equip.armor ? ITEMS[equip.armor].n : '—'}<small>${equip.armor ? 'bấm để tháo' : 'trống'}</small></button>`;

    craftList.innerHTML = RECIPES.map((r, i) => {
      const cost = Object.keys(r.cost).map((k) => `${ITEMS[k].n} ${r.cost[k]}`).join(', ');
      return `<button data-craft="${i}" ${canCraft(r) ? '' : 'disabled'}><b>${ITEMS[r.out].n}</b><small>${cost}</small></button>`;
    }).join('');
  }

  function toggleInv(force) {
    invOpen = force === undefined ? !invOpen : force;
    invEl.hidden = !invOpen;
    for (const k in keys) delete keys[k];
    target = null;
    if (invOpen) renderInv();
  }

  invEl.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.id === 'invx') toggleInv(false);
    else if (b.dataset.use) useItem(b.dataset.use);
    else if (b.dataset.craft !== undefined) craft(Number(b.dataset.craft));
    else if (b.dataset.slot) unequip(b.dataset.slot);
    if (invOpen) renderInv();
  });

  /* ---------- input ---------- */
  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'm') { toggleMute(); return; }
    if (!running) return;
    if (DLG.active) {
      if (k === 'escape') dlgEnd();
      else if (!e.repeat && (k === 'e' || k === ' ' || k === 'enter')) dlgAdvance();
      e.preventDefault();
      return;
    }
    if (paused) { if (k === 'escape') setPause(false); return; }
    if (jourOpen) { if (k === 'j' || k === 'escape') toggleJournal(false); return; }
    if (k === 'j') { if (!e.repeat) toggleJournal(); return; }
    if (k === 'escape') { if (invOpen) toggleInv(false); else setPause(true); return; }
    if (k === 'i') { if (!e.repeat) toggleInv(); return; }
    if (invOpen) return;
    if (k === 'f') { if (!e.repeat) doAction(); return; }
    if (k === 'e') { if (!e.repeat) interact(); return; }
    if (KEYS.includes(k)) {
      keys[k] = true;
      target = null;
      e.preventDefault();
    }
  });
  window.addEventListener('keyup', (e) => { delete keys[e.key.toLowerCase()]; });
  window.addEventListener('blur', () => { for (const k in keys) delete keys[k]; });

  cvEl.addEventListener('pointerdown', (e) => {
    if (invOpen || DLG.active || paused || !running || jourOpen) return;
    target = { x: camx + (e.clientX - vw / 2) / sc, y: camy + (e.clientY - vh / 2) / sc };
  });

  window.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'mouse') return;
    mouse.on = true;
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });
  document.addEventListener('mouseleave', () => { mouse.on = false; });

  const acts = document.getElementById('acts');
  acts.addEventListener('pointerdown', (e) => {
    const b = e.target.closest('.ab');
    if (!b) return;
    const k = b.dataset.k;
    if (k === 'j') { if (running && !DLG.active && !paused) toggleJournal(); return; }
    if (!running || DLG.active || paused || jourOpen) return;
    if (k === 'i') toggleInv();
    else if (invOpen) return;
    else if (k === 'f') doAction();
    else if (k === 'e') interact();
  });

  const joyEl = document.getElementById('joy');
  const knob = joyEl.querySelector('i');
  function jm(e) {
    const r = joyEl.getBoundingClientRect();
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const m = Math.hypot(dx, dy), mx = r.width / 2 - 8;
    if (m > mx) { dx = (dx / m) * mx; dy = (dy / m) * mx; }
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    joy.x = dx / mx;
    joy.y = dy / mx;
    target = null;
  }
  joyEl.addEventListener('pointerdown', (e) => {
    jid = e.pointerId;
    joyEl.setPointerCapture(jid);
    jm(e);
  });
  joyEl.addEventListener('pointermove', (e) => { if (e.pointerId === jid) jm(e); });
  const jend = (e) => {
    if (e.pointerId !== jid) return;
    jid = null;
    joy.x = joy.y = 0;
    knob.style.transform = '';
  };
  joyEl.addEventListener('pointerup', jend);
  joyEl.addEventListener('pointercancel', jend);

  /* ---------- canvas & vòng lặp ---------- */
  function resize() {
    vw = window.innerWidth;
    vh = window.innerHeight;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cvEl.width = Math.round(vw * dpr);
    cvEl.height = Math.round(vh * dpr);
    lc = mk(vw, vh);
    lg = lc.getContext('2d');
    sc = Math.min(1.1, Math.max(0.6, Math.min(vw / 1100, vh / 700)));
  }
  window.addEventListener('resize', resize);
  resize();

  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (running) {
      if (DLG.active) updDlg(dt);
      else if (!paused && !invOpen && !jourOpen) {
        T += dt;
        update(dt);
        autoT -= dt;
        if (autoT <= 0) { autoT = 45; saveGame(); }
      }
    }
    render();
  }

  bindStoryUI();
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
</body></html>
